<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DumDumDaw - The easiest DAW for beginners to create MIDI beats">
    <title>DumDumDaw | Simple MIDI Beat Maker</title>
    <link rel="stylesheet" href="web_components/index.css">
</head>
<body>
    <div class="main-content">
        <header class="header-content">
            <a href="/" class="navigation-link" aria-label="Go to homepage">
                <img class="logo" src="images/logo.svg" alt="DumDumDaw Logo">
                <h1 class="logo-text">DumDumDaw</h1>
            </a>
        </header>
        
        <main class="content-container">
            <div class="content-block">
                <div class="left-block">
                    <h1 class="text-block">The Best DAW For Dumdums!</h1>
                    <p class="smalltext-block">Make simple MIDI beats,<br>all in an easy-to-use<br>interface.</p>
                    <a href="/sequencer" class="cta-button" role="button">Open Builder</a>
                </div>
                
                <div class="screenshot-container">
                    <img class="app-screenshot" src="images/interface.png" alt="DumDumDaw interface showing beat sequencer">
                </div>
            </div>
        </main>
    </div>
</body>
</html>
